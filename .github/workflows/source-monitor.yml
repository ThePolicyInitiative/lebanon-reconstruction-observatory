name: Refresh source monitor

on:
  schedule:
    # GitHub Actions schedules are best-effort; this spreads the run away from the hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public-source metadata
        run: python scripts/scrape_official_sources.py --timeout 20

      - name: Validate and build
        run: |
          npm test
          npm run build

      - name: Commit refreshed metadata
        run: |
          if git diff --quiet -- data/source-snapshots.json; then
            echo "No source-monitor changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-snapshots.json
          git commit -m "Refresh source-monitor metadata"
          git push
